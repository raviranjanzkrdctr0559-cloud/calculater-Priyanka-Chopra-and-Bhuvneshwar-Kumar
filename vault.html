<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Vault</title>

<link rel="stylesheet" href="css/vault.css">
<link rel="manifest" href="manifest.json">
</head>

<body>

<div class="vault">

<div class="top">

<h1>🔐 My Vault</h1>

<button id="logoutBtn" title="Lock Vault">🔒</button>

</div>

<div class="grid">

<div class="card" id="photos">📷<br>Photos</div>
<input
type="file"
id="photoPicker"
accept="image/*"
hidden>
<div class="card" id="videos">🎥<br>Videos</div>

<div class="card" id="documents">📄<br>Documents</div>

<div class="card" id="folders">📁<br>Folders</div>

<div class="card" id="favorites">⭐<br>Favorites</div>

<div class="card" id="recycle">🗑️<br>Recycle Bin</div>

</div>

</div>

<script src="js/database.js"></script>
<script src="js/photos.js"></script>
<script src="js/vault.js"></script>
  <hr>

<h2>📷 My Photos</h2>

<div id="photoGallery" class="gallery">

    <p>No Photos Yet</p>

</div>
  <!-- Photo Preview -->

<div id="previewModal" class="preview-modal">

    <span id="closePreview">&times;</span>

    <img id="previewImage">

</div>
</body>
</html>
