<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Private Vault</title>

<link rel="stylesheet" href="vault.css">

</head>

<body>

<header>

<h2>🔐 Private Vault</h2>

<div class="top-icons">

<button title="Settings">⚙️</button>

<button title="Profile">👤</button>

</div>

</header>

<div class="search-box">

<input
type="text"
placeholder="Search Files..."
id="search"
>

</div>

<div class="categories">

<div class="card">
<span>🖼️</span>
Photos
</div>

<div class="card">
<span>🎥</span>
Videos
</div>

<div class="card">
<span>📄</span>
Documents
</div>

<div class="card">
<span>⭐</span>
Favorites
</div>

<div class="card">
<span>🗑️</span>
Recycle Bin
</div>

<div class="card">
<span>📁</span>
Folders
</div>

</div>

<div class="upload-area">

<h3>Upload Files</h3>

<label class="upload-btn">

Choose Files

<input
type="file"
id="fileInput"
multiple
>

</label>

</div>

<div
class="file-list"
id="fileList"
>

</div>

<button
class="lock-btn"
onclick="location.href='index.html'"
title="Lock Vault">

🔒

</button>

<script src="vault.js"></script>

</body>
</html>
